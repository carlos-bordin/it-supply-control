services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      # a aplicação final roda em nuvem e não depende de senhas, esta serve apenas para desenvolvimento local
      MSSQL_SA_PASSWORD: "Isc123##"
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql

volumes:
  sqlserver-data:
